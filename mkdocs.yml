site_name: MinivLLM 推理引擎原理与实践
site_description: 从神经网络基础层、Triton Attention 到调度与模型执行的中文源码教程
site_author: MinivLLM Ebook Contributors
site_url: !ENV [MKDOCS_SITE_URL, ""]
docs_dir: docs
site_dir: site
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
plugins:
  - search:
      lang:
        - en
        - zh
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - resources/style.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - 电子书首页: index.md
  - 阅读与实践指南: guide.md
  - 第一部分 · 入门与整体架构:
      - 本部分导读: parts/part01.md
      - 第 1 章 从自回归生成到推理引擎: chapters/ch01.md
      - 第 2 章 MinivLLM 架构、环境与端到端流程: chapters/ch02.md
  - 第二部分 · 基础层与张量并行:
      - 本部分导读: parts/part02.md
      - 第 3 章 激活函数与 RMSNorm: chapters/ch03.md
      - 第 4 章 并行线性层与权重加载: chapters/ch04.md
      - 第 5 章 Vocab Embedding、LM Head 与采样: chapters/ch05.md
      - 第 6 章 RoPE 旋转位置嵌入: chapters/ch06.md
  - 第三部分 · Attention 与 KV Cache:
      - 本部分导读: parts/part03.md
      - 第 7 章 KV Cache 内存布局与 Triton 写入: chapters/ch07.md
      - 第 8 章 Prefill：变长 FlashAttention 与 Online Softmax: chapters/ch08.md
      - 第 9 章 Decode：PagedAttention 与性能验证: chapters/ch09.md
  - 第四部分 · 模型组装:
      - 本部分导读: parts/part04.md
      - 第 10 章 组装 Qwen3 与 Llama 3.2 模型: chapters/ch10.md
  - 第五部分 · 推理引擎:
      - 本部分导读: parts/part05.md
      - 第 11 章 Sequence、Block 与 BlockManager: chapters/ch11.md
      - 第 12 章 Scheduler：Prefill、Decode 与抢占: chapters/ch12.md
      - 第 13 章 ModelRunner：数据准备、KV 显存与 CUDA Graph: chapters/ch13.md
      - 第 14 章 LLMEngine、多进程张量并行与生成 API: chapters/ch14.md
  - 第六部分 · 验证与扩展:
      - 本部分导读: parts/part06.md
      - 第 15 章 测试、性能评估、局限与扩展路线: chapters/ch15.md
  - MinivLLM 术语表: glossary.md
  - 资料来源与版本: sources.md
